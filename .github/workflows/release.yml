# =============================================================================
# ER Save Manager - Automated Release Workflow
# =============================================================================
#
# This workflow automates the release process:
#   1. PLAN: Detect version changes from conventional commits
#   2. CREATE: Bump version, update changelog, create release branch
#   3. FINALIZE: Create PR and draft GitHub release (attach binaries manually if desired)
#
# Triggers:
#   - Push to main branch (auto-release on merge)
#   - Manual workflow dispatch
#
# Tokens: Uses the default GITHUB_TOKEN (no secret required).
# Optionally set PUSH_TOKEN (PAT) if you need to bypass protections or chains that only react to PAT pushes.
#
# =============================================================================

name: Create Release Draft

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

# =============================================================================
# Environment Variables (Shared across jobs via outputs)
# =============================================================================

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Plan Release
  # ---------------------------------------------------------------------------
  # Determines if a release is needed by comparing current version with
  # the next version calculated from conventional commits.
  # ---------------------------------------------------------------------------
  plan:
    name: Plan Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      current_version: ${{ steps.get-versions.outputs.current_version }}
      next_version: ${{ steps.get-versions.outputs.next_version }}
      version_no_v: ${{ steps.get-versions.outputs.version_no_v }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: taiki-e/install-action@921a4027af787cda265c4f334a0f7f89b21d72e9 # v2.75.8
        with:
          tool: git-cliff

      - name: Get current and next versions
        id: get-versions
        run: |
          # Get current version from pyproject.toml
          current_version=$(grep -Po '(?<=^version = ")[^"]*' pyproject.toml)
          echo "current_version=v$current_version" >> "$GITHUB_OUTPUT"
          
          # Get next version from git-cliff (based on conventional commits)
          next_version=$(git cliff --bumped-version --unreleased)
          echo "next_version=$next_version" >> "$GITHUB_OUTPUT"
          
          # Also output version without 'v' prefix for artifact naming
          version_no_v="${next_version#v}"
          echo "version_no_v=$version_no_v" >> "$GITHUB_OUTPUT"
          
          echo "📌 Current version: v$current_version"
          echo "📌 Next version: $next_version"

      - name: Validate version tags
        run: |
          current_version="${{ steps.get-versions.outputs.current_version }}"
          
          # Check if the tag exists
          if [ -z "$(git tag -l "$current_version")" ]; then
            echo "❌ CRITICAL ERROR: Tag '$current_version' is missing!"
            echo "---------------------------------------------------"
            echo "git-cliff requires the LAST release to be tagged to calculate the NEXT release."
            echo "Without this tag, it assumes this is the first ever release (0.1.0)."
            echo ""
            echo "To fix this, run:"
            echo "  git tag $current_version <commit-hash-of-last-release>"
            echo "  git push origin $current_version"
            echo "---------------------------------------------------"
            exit 1
          else
            echo "✅ Tag '$current_version' verified."
          fi

  # ---------------------------------------------------------------------------
  # Job 2: Create Release Branch
  # ---------------------------------------------------------------------------
  # Creates the release branch with version bump, changelog update,
  # and prepares for artifact builds.
  # ---------------------------------------------------------------------------
  create-release-branch:
    needs: plan
    name: Create Release Branch
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    if: needs.plan.outputs.current_version != needs.plan.outputs.next_version
    env:
      NEXT_VERSION: ${{ needs.plan.outputs.next_version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.PUSH_TOKEN || github.token }}

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: ".python-version"

      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0

      - uses: taiki-e/install-action@921a4027af787cda265c4f334a0f7f89b21d72e9 # v2.75.8
        with:
          tool: git-cliff

      - name: Bump version and update changelog
        run: |
          # Bump version in pyproject.toml
          uv run scripts/bump_version.py "$NEXT_VERSION"
          
          # Update uv.lock with new version
          uv sync
          
          # Update changelog only if this version section doesn't already exist
          # This allows manual edits to be preserved on subsequent runs
          if ! grep -q "^## 📦 Release $NEXT_VERSION" CHANGELOG.md 2>/dev/null; then
            git cliff --tag "$NEXT_VERSION" -o CHANGELOG.md
          fi

      - name: Commit and push release branch
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions"
          git add pyproject.toml uv.lock CHANGELOG.md resources/version.txt resources/app.manifest src/er_save_manager/__init__.py
          
          # Check if there are staged changes
          if git diff --staged --quiet; then
            echo "📌 No changes to commit (version unchanged)"
            echo "💡 Tip: Use conventional commits to trigger version bumps"
            echo "   Examples: feat: add feature, fix: fix bug, docs: update docs"
            exit 0
          fi
          
          git commit -m "🚀 Release: Prepare ER Save Manager $NEXT_VERSION"
          git push origin "HEAD:refs/heads/release-$NEXT_VERSION" --force

  # ---------------------------------------------------------------------------
  # Job 3: Finalize Release
  # ---------------------------------------------------------------------------
  # Creates PR and draft GitHub release (changelog in notes).
  # ---------------------------------------------------------------------------
  finalize-release:
    needs:
      - plan
      - create-release-branch
    name: Finalize Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    if: needs.plan.outputs.current_version != needs.plan.outputs.next_version
    env:
      NEXT_VERSION: ${{ needs.plan.outputs.next_version }}
      VERSION_NO_V: ${{ needs.plan.outputs.version_no_v }}
      GH_TOKEN: ${{ secrets.PUSH_TOKEN || github.token }}
      GITHUB_TOKEN: ${{ secrets.PUSH_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: release-${{ needs.plan.outputs.next_version }}
          token: ${{ secrets.PUSH_TOKEN || github.token }}

      - name: Extract changelog for this release
        id: changelog
        run: |
          chmod +x scripts/extract_changelog.sh
          changelog=$(./scripts/extract_changelog.sh "$NEXT_VERSION")
          
          # Save to file for PR body
          echo "$changelog" > release_changelog.txt
          
          # Also set as output for release notes
          {
            echo "content<<EOF"
            echo "$changelog"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update pull request
        run: |
          set -euo pipefail
          changelog=$(cat release_changelog.txt)
          pr_title="🚀 Release: ER Save Manager $NEXT_VERSION"
          head_branch="release-${NEXT_VERSION}"

          {
            echo "## 🚧 UNRELEASED"
            echo ""
            echo "**This release is still under development.**"
            echo "Changes in this PR will be included in the final release once merged."
            echo ""
            echo "---"
            echo ""
            echo "$changelog"
          } > pr_body.txt

          pr_body=$(cat pr_body.txt)
          repo="$GITHUB_REPOSITORY"
          owner="$GITHUB_REPOSITORY_OWNER"

          pr_num=$(gh pr list --repo "$repo" --base main --state open \
            --head "${owner}:${head_branch}" \
            --json number \
            --jq 'try .[0].number catch ""' 2>/dev/null || true)

          if [ -z "$pr_num" ] || [ "$pr_num" = "null" ]; then
            pr_num=$(gh pr list --repo "$repo" --base main --state open \
              --head "$head_branch" \
              --json number \
              --jq 'try .[0].number catch ""' 2>/dev/null || true)
          fi

          if [ -n "$pr_num" ] && [ "$pr_num" != "null" ]; then
            echo "Updating existing PR #$pr_num..."
            gh pr edit "$pr_num" -b "$pr_body"
          else
            echo "Creating PR from $head_branch..."
            gh pr create -B main --title "$pr_title" -b "$pr_body" --head "$head_branch"
          fi

      - name: Delete old release drafts
        uses: hugo19941994/delete-draft-releases@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.PUSH_TOKEN || github.token }}
        with:
          threshold: "1s"

      - name: Create draft release
        run: |
          chmod +x scripts/create_release.sh
          ./scripts/create_release.sh "$NEXT_VERSION" "${{ steps.changelog.outputs.content }}"
